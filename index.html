<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAS! Timetable</title>

<!-- Libraries for export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f8f5fb;
    --card: #ffffff;
    --text: #4d4654;
    --muted: #8b8492;
    --border: #e9e2ed;
    --primary: #9c82b5;
    --primary-dark: #76568f;
    --danger: #d88989;
    --shadow: 0 8px 25px rgba(80, 60, 90, 0.08);
}

body {
    margin: 0;
    font-family: Arial, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* ---------- HEADER ---------- */

header {
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--border);
    padding: 18px 25px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
}

.header-inner {
    max-width: 1500px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: var(--primary-dark);
}

.logo span {
    color: #c58fb1;
}

.header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

/* ---------- BUTTONS ---------- */

button,
select,
input {
    font: inherit;
}

button {
    border: none;
    cursor: pointer;
}

.btn {
    padding: 10px 15px;
    border-radius: 12px;
    background: #f2edf5;
    color: var(--text);
    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-1px);
    background: #eae1ef;
}

.btn.primary {
    background: var(--primary);
    color: white;
}

.btn.primary:hover {
    background: var(--primary-dark);
}

.btn.danger {
    background: #f6e1e1;
    color: #a55c5c;
}

/* ---------- MAIN ---------- */

.container {
    width: min(1500px, 95%);
    margin: 25px auto 60px;
}

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
}

.panel-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* ---------- SETTINGS ---------- */

.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field label {
    font-size: 13px;
    color: var(--muted);
}

.field input,
.field select {
    width: 100%;
    border: 1px solid var(--border);
    background: #fcfbfd;
    border-radius: 11px;
    padding: 10px;
    outline: none;
}

.field input:focus,
.field select:focus {
    border-color: var(--primary);
}

/* ---------- SUBJECT COLORS ---------- */

.subject-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
}

.subject-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #faf8fb;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
}

.color-circle {
    width: 27px;
    height: 27px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 0 1px #ddd;
    cursor: pointer;
    padding: 0;
}

/* ---------- TIMETABLE ---------- */

.table-wrapper {
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 15px;
    border: 1px solid var(--border);
}

.timetable {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 900px;
    table-layout: fixed;
}

.timetable th,
.timetable td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}

.timetable th {
    background: #f7f3f9;
    padding: 13px 8px;
    font-size: 14px;
    text-align: center;
}

.time-cell {
    width: 100px;
    min-width: 100px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    background: #faf8fb;
    padding: 7px;
}

.day-cell {
    height: 65px;
    min-height: 65px;
    padding: 4px;
    vertical-align: top;
}

.empty-cell {
    background: #fff;
}

.deleted-time {
    background: repeating-linear-gradient(
        45deg,
        #f7f3f9,
        #f7f3f9 8px,
        #eee8f1 8px,
        #eee8f1 16px
    );
}

/* ---------- LESSON ---------- */

.lesson {
    width: 100%;
    height: 100%;
    min-height: 55px;
    border-radius: 11px;
    padding: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: 0.15s;
    overflow: hidden;
}

.lesson:hover {
    transform: scale(1.015);
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.lesson-name {
    font-weight: bold;
    font-size: 14px;
}

.lesson-info {
    font-size: 11px;
    margin-top: 4px;
    opacity: 0.75;
}

.lesson-long {
    min-height: 120px;
}

/* ---------- MODAL ---------- */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(45, 35, 50, 0.35);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 500;
    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: min(600px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.modal h2 {
    margin-top: 0;
}

.modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
}

.modal-full {
    grid-column: 1 / -1;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
}

/* ---------- COLOR PICKER ---------- */

.color-picker-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.color-picker {
    width: 55px;
    height: 40px;
    border: none;
    padding: 0;
    background: none;
    cursor: pointer;
}

/* ---------- DELETE TIME ---------- */

.deleted-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.deleted-item {
    background: #f6e4e4;
    color: #985b5b;
    padding: 8px 10px;
    border-radius: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
}

.deleted-item button {
    background: none;
    color: inherit;
    font-weight: bold;
}

/* ---------- TOAST ---------- */

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #4d4654;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    opacity: 0;
    transition: 0.3s;
    z-index: 1000;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ---------- PRINT ---------- */

@media print {

    body {
        background: white;
    }

    header,
    .settings-panel,
    .subject-panel,
    .actions-panel,
    .no-print {
        display: none !important;
    }

    .container {
        width: 100%;
        margin: 0;
    }

    .panel {
        border: none;
        box-shadow: none;
        padding: 0;
    }

    .table-wrapper {
        overflow: visible;
        border: none;
    }

    .timetable {
        min-width: 0;
        width: 100%;
    }

    .timetable th,
    .timetable td {
        border-color: #ccc;
    }

    .lesson {
        box-shadow: none !important;
    }

    @page {
        size: A4 landscape;
        margin: 5mm;
    }
}

/* ---------- MOBILE ---------- */

@media (max-width: 700px) {

    .header-inner {
        align-items: flex-start;
        flex-direction: column;
    }

    .modal-grid {
        grid-template-columns: 1fr;
    }

    .modal-full {
        grid-column: auto;
    }

    .container {
        width: 97%;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            YAS<span>!</span> Timetable
        </div>

        <div class="header-actions">

            <button class="btn" onclick="openLessonModal()">
                ＋ <span data-i18n="addLesson">Ajouter</span>
            </button>

            <button class="btn" onclick="saveData()">
                💾 <span data-i18n="save">Sauvegarder</span>
            </button>

            <button class="btn" onclick="window.print()">
                🖨️ <span data-i18n="print">Imprimer</span>
            </button>

            <button class="btn" onclick="exportPNG()">
                🖼️ PNG
            </button>

            <button class="btn primary" onclick="exportPDF()">
                📄 PDF
            </button>

        </div>

    </div>
</header>


<main class="container">

    <!-- SETTINGS -->

    <section class="panel settings-panel no-print">

        <div class="panel-title" data-i18n="settings">
            Paramètres
        </div>

        <div class="settings-grid">

            <div class="field">
                <label data-i18n="language">
                    Langue
                </label>

                <select id="language" onchange="changeLanguage(this.value)">
                    <option value="fr">Français</option>
                    <option value="ar">العربية</option>
                    <option value="darija">الدارجة</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                </select>
            </div>


            <div class="field">
                <label data-i18n="startDay">
                    Début de la journée
                </label>

                <input
                    type="time"
                    id="dayStart"
                    value="08:00"
                    onchange="renderTimetable()"
                >
            </div>


            <div class="field">
                <label data-i18n="endDay">
                    Fin de la journée
                </label>

                <input
                    type="time"
                    id="dayEnd"
                    value="18:00"
                    onchange="renderTimetable()"
                >
            </div>


            <div class="field">
                <label data-i18n="slot">
                    Durée d'une tranche
                </label>

                <select id="slotDuration" onchange="renderTimetable()">
                    <option value="30">30 min</option>
                    <option value="60" selected>1 h</option>
                    <option value="90">1 h 30</option>
                    <option value="120">2 h</option>
                </select>
            </div>

        </div>

    </section>


    <!-- DELETE TIME -->

    <section class="panel no-print">

        <div class="panel-title" data-i18n="deletePeriod">
            Supprimer une période vide
        </div>

        <div class="settings-grid">

            <div class="field">
                <label data-i18n="from">
                    De
                </label>

                <input type="time" id="deleteStart" value="13:00">
            </div>

            <div class="field">
                <label data-i18n="to">
                    À
                </label>

                <input type="time" id="deleteEnd" value="14:00">
            </div>

            <div class="field">
                <label>&nbsp;</label>

                <button class="btn danger" onclick="deleteTimePeriod()">
                    🗑️ <span data-i18n="delete">Supprimer</span>
                </button>
            </div>

        </div>


        <div style="margin-top:15px">

            <div
                style="font-size:13px;color:var(--muted);margin-bottom:8px"
                data-i18n="deletedPeriods"
            >
                Périodes supprimées
            </div>

            <div id="deletedList" class="deleted-list"></div>

        </div>

    </section>


    <!-- SUBJECT COLORS -->

    <section class="panel subject-panel no-print">

        <div class="panel-title" data-i18n="colors">
            Couleurs des matières
        </div>

        <div id="subjectList" class="subject-list"></div>

    </section>


    <!-- ACTIONS -->

    <section class="panel actions-panel no-print">

        <div class="panel-title" data-i18n="days">
            Jours
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap">

            <button class="btn" onclick="addDay()">
                ＋ <span data-i18n="addDay">Ajouter un jour</span>
            </button>

            <button class="btn danger" onclick="removeDay()">
                − <span data-i18n="removeDay">Supprimer le dernier jour</span>
            </button>

            <button class="btn" onclick="newTimetable()">
                🔄 <span data-i18n="new">Nouveau tableau</span>
            </button>

        </div>

    </section>


    <!-- TIMETABLE -->

    <section class="panel">

        <div
            id="printTitle"
            style="
                text-align:center;
                font-size:24px;
                font-weight:bold;
                margin-bottom:18px;
            "
        >
            YAS! Timetable
        </div>

        <div class="table-wrapper">

            <table
                id="timetable"
                class="timetable"
            >
            </table>

        </div>

    </section>

</main>


<!-- LESSON MODAL -->

<div id="lessonModal" class="modal-overlay">

    <div class="modal">

        <h2 id="modalTitle">
            Ajouter une séance
        </h2>

        <div class="modal-grid">

            <div class="field">
                <label data-i18n="day">
                    Jour
                </label>

                <select id="lessonDay"></select>
            </div>


            <div class="field">
                <label data-i18n="subject">
                    Matière
                </label>

                <input
                    type="text"
                    id="lessonSubject"
                    list="subjectOptions"
                    placeholder="Math"
                >

                <datalist id="subjectOptions"></datalist>

            </div>


            <div class="field">
                <label data-i18n="start">
                    Début
                </label>

                <input
                    type="time"
                    id="lessonStart"
                    value="08:00"
                >
            </div>


            <div class="field">
                <label data-i18n="end">
                    Fin
                </label>

                <input
                    type="time"
                    id="lessonEnd"
                    value="09:00"
                >
            </div>


            <div class="field">
                <label data-i18n="teacher">
                    Professeur
                </label>

                <input
                    type="text"
                    id="lessonTeacher"
                    placeholder="..."
                >
            </div>


            <div class="field">
                <label data-i18n="room">
                    Salle / Classe
                </label>

                <input
                    type="text"
                    id="lessonRoom"
                    placeholder="..."
                >
            </div>


            <div class="field modal-full">

                <label data-i18n="color">
                    Couleur
                </label>

                <div class="color-picker-row">

                    <input
                        type="color"
                        id="lessonColor"
                        class="color-picker"
                        value="#d9c5e8"
                    >

                    <span
                        id="colorHex"
                        style="font-size:13px;color:#888"
                    >
                        #d9c5e8
                    </span>

                </div>

            </div>

        </div>


        <div class="modal-actions">

            <button
                class="btn danger"
                id="deleteLessonBtn"
                onclick="deleteCurrentLesson()"
                style="display:none"
            >
                🗑️ <span data-i18n="delete">Supprimer</span>
            </button>

            <button
                class="btn"
                onclick="closeLessonModal()"
            >
                <span data-i18n="cancel">Annuler</span>
            </button>

            <button
                class="btn primary"
                onclick="saveLesson()"
            >
                ✓ <span data-i18n="confirm">Enregistrer</span>
            </button>

        </div>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
   DATA
========================================================= */

const translations = {

    fr: {
        addLesson:"Ajouter",
        save:"Sauvegarder",
        print:"Imprimer",
        settings:"Paramètres",
        language:"Langue",
        startDay:"Début de la journée",
        endDay:"Fin de la journée",
        slot:"Durée d'une tranche",
        deletePeriod:"Supprimer une période vide",
        from:"De",
        to:"À",
        delete:"Supprimer",
        deletedPeriods:"Périodes supprimées",
        colors:"Couleurs des matières",
        days:"Jours",
        addDay:"Ajouter un jour",
        removeDay:"Supprimer le dernier jour",
        new:"Nouveau tableau",
        day:"Jour",
        subject:"Matière",
        start:"Début",
        end:"Fin",
        teacher:"Professeur",
        room:"Salle / Classe",
        color:"Couleur",
        cancel:"Annuler",
        confirm:"Enregistrer"
    },

    en: {
        addLesson:"Add",
        save:"Save",
        print:"Print",
        settings:"Settings",
        language:"Language",
        startDay:"Day start",
        endDay:"Day end",
        slot:"Time slot",
        deletePeriod:"Delete empty period",
        from:"From",
        to:"To",
        delete:"Delete",
        deletedPeriods:"Deleted periods",
        colors:"Subject colors",
        days:"Days",
        addDay:"Add day",
        removeDay:"Remove last day",
        new:"New timetable",
        day:"Day",
        subject:"Subject",
        start:"Start",
        end:"End",
        teacher:"Teacher",
        room:"Room / Class",
        color:"Color",
        cancel:"Cancel",
        confirm:"Save"
    },

    es: {
        addLesson:"Añadir",
        save:"Guardar",
        print:"Imprimir",
        settings:"Configuración",
        language:"Idioma",
        startDay:"Inicio del día",
        endDay:"Fin del día",
        slot:"Duración",
        deletePeriod:"Eliminar período vacío",
        from:"Desde",
        to:"Hasta",
        delete:"Eliminar",
        deletedPeriods:"Períodos eliminados",
        colors:"Colores de asignaturas",
        days:"Días",
        addDay:"Añadir día",
        removeDay:"Eliminar último día",
        new:"Nuevo horario",
        day:"Día",
        subject:"Asignatura",
        start:"Inicio",
        end:"Fin",
        teacher:"Profesor",
        room:"Aula / Clase",
        color:"Color",
        cancel:"Cancelar",
        confirm:"Guardar"
    },

    ar: {
        addLesson:"إضافة",
        save:"حفظ",
        print:"طباعة",
        settings:"الإعدادات",
        language:"اللغة",
        startDay:"بداية اليوم",
        endDay:"نهاية اليوم",
        slot:"مدة الخانة",
        deletePeriod:"حذف فترة فارغة",
        from:"من",
        to:"إلى",
        delete:"حذف",
        deletedPeriods:"الفترات المحذوفة",
        colors:"ألوان المواد",
        days:"الأيام",
        addDay:"إضافة يوم",
        removeDay:"حذف آخر يوم",
        new:"جدول جديد",
        day:"اليوم",
        subject:"المادة",
        start:"البداية",
        end:"النهاية",
        teacher:"الأستاذ",
        room:"القسم / القاعة",
        color:"اللون",
        cancel:"إلغاء",
        confirm:"حفظ"
    },

    darija: {
        addLesson:"زيد حصة",
        save:"حفظ",
        print:"طبع",
        settings:"الإعدادات",
        language:"اللغة",
        startDay:"بداية النهار",
        endDay:"نهاية النهار",
        slot:"مدة الخانة",
        deletePeriod:"مسح فترة خاوية",
        from:"من",
        to:"حتى",
        delete:"مسح",
        deletedPeriods:"الفترات الممسوحة",
        colors:"ألوان المواد",
        days:"الأيام",
        addDay:"زيد نهار",
        removeDay:"مسح آخر نهار",
        new:"جدول جديد",
        day:"النهار",
        subject:"المادة",
        start:"البداية",
        end:"النهاية",
        teacher:"الأستاذ",
        room:"القسم / القاعة",
        color:"اللون",
        cancel:"إلغاء",
        confirm:"حفظ"
    }
};


/* =========================================================
   DEFAULT DATA
========================================================= */

let state = {

    language: "fr",

    dayStart: "08:00",

    dayEnd: "18:00",

    slotDuration: 60,

    days: [
        "Lundi",
        "Mardi",
        "Mercredi",
        "Jeudi",
        "Vendredi",
        "Samedi"
    ],

    lessons: [],

    deletedPeriods: [],

    colors: {

        "Math": "#c9dcf2",

        "Français": "#f3c7d9",

        "English": "#d9c8ee",

        "العربية": "#e9b6b6",

        "التربية الإسلامية": "#f4df9e",

        "Philosophie": "#d9c5b2",

        "EPS": "#a8c7b0",

        "Physique": "#b4c9e8",

        "Chimie": "#b4c9e8",

        "SVT": "#c8dfc5"

    }

};


let editingLessonId = null;


/* =========================================================
   INITIALIZATION
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    loadData();

    document.getElementById("language").value = state.language;

    document.getElementById("dayStart").value = state.dayStart;

    document.getElementById("dayEnd").value = state.dayEnd;

    document.getElementById("slotDuration").value = state.slotDuration;

    applyLanguage();

    renderSubjectColors();

    renderTimetable();

    updateDeletedList();

});


/* =========================================================
   LANGUAGE
========================================================= */

function changeLanguage(lang) {

    state.language = lang;

    applyLanguage();

    renderTimetable();

    saveData(false);
}


function applyLanguage() {

    const lang = state.language;

    document.documentElement.lang =
        lang === "darija" ? "ar" : lang;

    if (lang === "ar" || lang === "darija") {

        document.documentElement.dir = "rtl";

        document.body.style.direction = "rtl";

    } else {

        document.documentElement.dir = "ltr";

        document.body.style.direction = "ltr";

    }

    document.querySelectorAll("[data-i18n]").forEach(el => {

        const key = el.dataset.i18n;

        if (translations[lang][key]) {

            el.textContent = translations[lang][key];

        }

    });

}


/* =========================================================
   TIME FUNCTIONS
========================================================= */

function timeToMinutes(time) {

    const [h,m] = time.split(":").map(Number);

    return h * 60 + m;
}


function minutesToTime(minutes) {

    minutes = ((minutes % 1440) + 1440) % 1440;

    const h = Math.floor(minutes / 60)
        .toString()
        .padStart(2,"0");

    const m = (minutes % 60)
        .toString()
        .padStart(2,"0");

    return `${h}:${m}`;
}


/* =========================================================
   GET TIME SLOTS
========================================================= */

function getTimeSlots() {

    const start = timeToMinutes(
        document.getElementById("dayStart").value
    );

    const end = timeToMinutes(
        document.getElementById("dayEnd").value
    );

    const duration = Number(
        document.getElementById("slotDuration").value
    );

    let slots = [];

    for (
        let t = start;
        t < end;
        t += duration
    ) {

        let slotEnd = Math.min(t + duration, end);

        slots.push({
            start: minutesToTime(t),
            end: minutesToTime(slotEnd)
        });

    }

    return slots;
}


/* =========================================================
   DELETE PERIOD
========================================================= */

function deleteTimePeriod() {

    const start =
        document.getElementById("deleteStart").value;

    const end =
        document.getElementById("deleteEnd").value;

    if (!start || !end) {

        showToast("Choisissez les deux horaires.");

        return;
    }

    if (timeToMinutes(start) >= timeToMinutes(end)) {

        showToast("L'heure de fin doit être après l'heure de début.");

        return;
    }


    /* Check whether a lesson exists inside the deleted period */

    const conflict = state.lessons.some(lesson => {

        return (

            timeToMinutes(lesson.start) <
            timeToMinutes(end)

            &&

            timeToMinutes(lesson.end) >
            timeToMinutes(start)

        );

    });


    if (conflict) {

        showToast(
            "Impossible : une séance existe pendant cette période."
        );

        return;
    }


    state.deletedPeriods.push({
        start,
        end
    });

    renderTimetable();

    updateDeletedList();

    saveData(false);

    showToast("Période supprimée.");
}


function restorePeriod(index) {

    state.deletedPeriods.splice(index,1);

    renderTimetable();

    updateDeletedList();

    saveData(false);
}


function isTimeDeleted(start, end) {

    const s = timeToMinutes(start);
    const e = timeToMinutes(end);

    return state.deletedPeriods.some(period => {

        const ps = timeToMinutes(period.start);
        const pe = timeToMinutes(period.end);

        return s >= ps && e <= pe;

    });
}


function updateDeletedList() {

    const container =
        document.getElementById("deletedList");

    container.innerHTML = "";

    state.deletedPeriods.forEach((period,index) => {

        const div = document.createElement("div");

        div.className = "deleted-item";

        div.innerHTML = `
            ${period.start} → ${period.end}
            <button onclick="restorePeriod(${index})">×</button>
        `;

        container.appendChild(div);

    });

}


/* =========================================================
   RENDER TIMETABLE
========================================================= */

function renderTimetable() {

    state.dayStart =
        document.getElementById("dayStart").value;

    state.dayEnd =
        document.getElementById("dayEnd").value;

    state.slotDuration =
        Number(document.getElementById("slotDuration").value);


    const table =
        document.getElementById("timetable");

    table.innerHTML = "";


    const slots = getTimeSlots();


    /* HEADER */

    const thead =
        document.createElement("thead");

    const headerRow =
        document.createElement("tr");


    const emptyHeader =
        document.createElement("th");

    emptyHeader.textContent = "⏰";

    headerRow.appendChild(emptyHeader);


    state.days.forEach(day => {

        const th =
            document.createElement("th");

        th.textContent = day;

        headerRow.appendChild(th);

    });


    thead.appendChild(headerRow);

    table.appendChild(thead);


    /* BODY */

    const tbody =
        document.createElement("tbody");


    /*
       We use a normal time grid.
       A lesson spanning several hours gets rowspan,
       therefore it becomes ONE large merged cell.
    */

    let skip = {};

    slots.forEach((slot, slotIndex) => {

        const row =
            document.createElement("tr");


        const timeCell =
            document.createElement("td");

        timeCell.className = "time-cell";

        timeCell.innerHTML =
            `<strong>${slot.start}</strong><br>↓<br>${slot.end}`;

        row.appendChild(timeCell);


        state.days.forEach((day, dayIndex) => {

            if (skip[dayIndex] > 0) {

                skip[dayIndex]--;

                return;

            }


            const cell =
                document.createElement("td");

            cell.className = "day-cell";


            /*
              Find lesson that starts exactly here.
            */

            const lesson =
                state.lessons.find(l =>

                    l.day === day

                    &&

                    l.start === slot.start

                );


            if (lesson) {

                const lessonStart =
                    timeToMinutes(lesson.start);

                const lessonEnd =
                    timeToMinutes(lesson.end);


                const duration =
                    lessonEnd - lessonStart;


                const slotMinutes =
                    Number(state.slotDuration);


                /*
                   Number of rows to merge.
                */

                let rowSpan =
                    Math.ceil(duration / slotMinutes);


                /*
                   Don't merge through deleted periods.
                */

                let validRows = 0;

                for (
                    let i = slotIndex;
                    i < slots.length;
                    i++
                ) {

                    const current =
                        slots[i];

                    if (
                        isTimeDeleted(
                            current.start,
                            current.end
                        )
                    ) break;


                    const currentStart =
                        timeToMinutes(current.start);

                    if (currentStart >= lessonEnd)
                        break;

                    validRows++;

                }


                rowSpan =
                    Math.max(1, validRows);


                cell.rowSpan = rowSpan;


                skip[dayIndex] =
                    rowSpan - 1;


                const lessonDiv =
                    createLessonElement(lesson);


                cell.appendChild(lessonDiv);


            } else {

                /*
                   Check if this time belongs
                   to a deleted period.
                */

                if (
                    isTimeDeleted(
                        slot.start,
                        slot.end
                    )
                ) {

                    cell.classList.add("deleted-time");

                } else {

                    cell.classList.add("empty-cell");

                    cell.addEventListener(
                        "dblclick",
                        () => {

                            openLessonModal({
                                day,
                                start: slot.start,
                                end: slot.end
                            });

                        }
                    );

                }

            }


            row.appendChild(cell);

        });


        tbody.appendChild(row);

    });


    table.appendChild(tbody);

}


/* =========================================================
   LESSON ELEMENT
========================================================= */

function createLessonElement(lesson) {

    const div =
        document.createElement("div");

    div.className = "lesson";


    const duration =
        timeToMinutes(lesson.end)
        -
        timeToMinutes(lesson.start);


    if (duration >= 120) {

        div.classList.add("lesson-long");

    }


    const color =
        lesson.color
        ||
        getSubjectColor(lesson.subject);


    div.style.background = color;


    /*
       Calculate a readable text color.
    */

    div.style.color =
        getContrastColor(color);


    let info = "";

    if (lesson.teacher) {

        info += lesson.teacher;

    }

    if (lesson.room) {

        if (info) info += " • ";

        info += lesson.room;

    }


    div.innerHTML = `

        <div class="lesson-name">
            ${escapeHTML(lesson.subject)}
        </div>

        <div class="lesson-info">
            ${lesson.start} – ${lesson.end}
        </div>

        ${
            info
            ?
            `<div class="lesson-info">
                ${escapeHTML(info)}
            </div>`
            :
            ""
        }

    `;


    div.onclick = () =>
        openLessonModal(lesson);


    return div;
}


/* =========================================================
   SUBJECT COLORS
========================================================= */

function getSubjectColor(subject) {

    if (!state.colors[subject]) {

        state.colors[subject] =
            generatePastelColor();

    }

    return state.colors[subject];
}


function generatePastelColor() {

    const colors = [
        "#c9dcf2",
        "#f3c7d9",
        "#d9c8ee",
        "#e9b6b6",
        "#f4df9e",
        "#d9c5b2",
        "#a8c7b0",
        "#b4c9e8",
        "#c8dfc5",
        "#e7c9e5",
        "#c8e2df"
    ];

    return colors[
        Math.floor(Math.random() * colors.length)
    ];
}


function renderSubjectColors() {

    const container =
        document.getElementById("subjectList");

    container.innerHTML = "";


    const subjects =
        Object.keys(state.colors);


    state.lessons.forEach(lesson => {

        if (!subjects.includes(lesson.subject)) {

            subjects.push(lesson.subject);

        }

    });


    subjects.forEach(subject => {

        const item =
            document.createElement("div");

        item.className = "subject-item";


        const colorInput =
            document.createElement("input");

        colorInput.type = "color";

        colorInput.className =
            "color-circle";

        colorInput.value =
            getSubjectColor(subject);


        colorInput.oninput = () => {

            state.colors[subject] =
                colorInput.value;


            /*
               Update lessons using this
               subject unless they have
               their own custom color.
            */

            state.lessons.forEach(lesson => {

                if (
                    lesson.subject === subject
                    &&
                    !lesson.customColor
                ) {

                    lesson.color =
                        colorInput.value;

                }

            });


            renderTimetable();

            saveData(false);

        };


        const name =
            document.createElement("span");

        name.textContent = subject;


        item.appendChild(colorInput);

        item.appendChild(name);

        container.appendChild(item);

    });

}

/* =========================================================
   SAVE LESSON
========================================================= */

function saveLesson() {

    const day =
        document.getElementById(
            "lessonDay"
        ).value;


    const subject =
        document.getElementById(
            "lessonSubject"
        ).value.trim();


    const start =
        document.getElementById(
            "lessonStart"
        ).value;


    const end =
        document.getElementById(
            "lessonEnd"
        ).value;


    const teacher =
        document.getElementById(
            "lessonTeacher"
        ).value.trim();


    const room =
        document.getElementById(
            "lessonRoom"
        ).value.trim();


    const color =
        document.getElementById(
            "lessonColor"
        ).value;


    if (!subject) {

        showToast("Veuillez entrer une matière.");

        return;
    }


    if (
        !start ||
        !end ||
        timeToMinutes(start)
        >=
        timeToMinutes(end)
    ) {

        showToast("Vérifiez les horaires.");

        return;
    }


    /*
       Check deleted period.
    */

    if (
        state.deletedPeriods.some(period => {

            return (

                timeToMinutes(start)
                <
                timeToMinutes(period.end)

                &&

                timeToMinutes(end)
                >
                timeToMinutes(period.start)

            );

        })
    ) {

        showToast(
            "Cette séance traverse une période supprimée."
        );

        return;
    }


    /*
       Check overlap with other lessons.
    */

    const overlap =
        state.lessons.some(existing => {

            if (
                editingLessonId
                &&
                existing.id === editingLessonId
            ) {
                return false;
            }


            if (existing.day !== day) {

                return false;

            }


            const a =
                timeToMinutes(start);

            const b =
                timeToMinutes(end);

            const c =
                timeToMinutes(existing.start);

            const d =
                timeToMinutes(existing.end);


            return a < d && b > c;

        });


    if (overlap) {

        showToast(
            "Cette séance chevauche une autre séance."
        );

        return;
    }


    /*
       If editing
    */

    if (editingLessonId) {

        const lesson =
            state.lessons.find(
                l => l.id === editingLessonId
            );


        if (lesson) {

            lesson.day = day;

            lesson.subject = subject;

            lesson.start = start;

            lesson.end = end;

            lesson.teacher = teacher;

            lesson.room = room;

            lesson.color = color;

            lesson.customColor = true;

        }

    }

    else {

        state.lessons.push({

            id:
                Date.now().toString(),

            day,

            subject,

            start,

            end,

            teacher,

            room,

            color,

            customColor: true

        });

    }


    /*
       Automatically create a subject color
       if necessary.
    */

    if (!state.colors[subject]) {

        state.colors[subject] =
            color;

    }


    renderSubjectColors();

    renderTimetable();

    saveData(false);

    closeLessonModal();

    showToast("Séance enregistrée.");

}

async function exportPNG() {

/* =========================================================
   PDF EXPORT
========================================================= */

async function exportPDF() {

    const table =
        document.getElementById("timetable");


    const wrapper =
        table.parentElement;


    const oldOverflow =
        wrapper.style.overflow;


    const oldWidth =
        table.style.width;


    wrapper.style.overflow =
        "visible";


    table.style.width =
        "max-content";


    try {

        const canvas =
            await html2canvas(table, {

                scale: 3,

                useCORS: true,

                backgroundColor: "#ffffff",

                logging: false,

                windowWidth:
                    Math.max(
                        document.documentElement.scrollWidth,
                        table.scrollWidth
                    )

            });


        const imgData =
            canvas.toDataURL(
                "image/png",
                1.0
            );


        const {
            jsPDF
        } = window.jspdf;


        const pdf =
            new jsPDF({

                orientation: "landscape",

                unit: "mm",

                format: "a4",

                compress: true

            });


        const pageWidth =
            pdf.internal.pageSize.getWidth();


        const pageHeight =
            pdf.internal.pageSize.getHeight();


        const margin = 5;


        const availableWidth =
            pageWidth - margin * 2;


        const availableHeight =
            pageHeight - margin * 2;


        const imageRatio =
            canvas.width /
            canvas.height;


        let width =
            availableWidth;


        let height =
            width / imageRatio;


        /*
           If height doesn't fit, scale it down.
        */

        if (height > availableHeight) {

            height =
                availableHeight;

            width =
                height * imageRatio;

        }


        const x =
            (pageWidth - width) / 2;


        const y =
            (pageHeight - height) / 2;


        pdf.addImage(

            imgData,

            "PNG",

            x,

            y,

            width,

            height,

            undefined,

            "FAST"

        );


        pdf.save(
            "YAS-Timetable.pdf"
        );


        showToast("PDF créé ✓");

    }

    catch(error) {

        console.error(error);

        showToast(
            "Erreur pendant la création du PDF."
        );

    }


    wrapper.style.overflow =
        oldOverflow;

    table.style.width =
        oldWidth;

}


/* =========================================================
   HELPERS
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");


    toast.textContent =
        message;


    toast.classList.add("show");


    setTimeout(() => {

        toast.classList.remove("show");

    }, 2500);

}


function escapeHTML(text) {

    return String(text)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


function getContrastColor(hex) {

    hex =
        hex.replace("#","");


    const r =
        parseInt(
            hex.substring(0,2),
            16
        );


    const g =
        parseInt(
            hex.substring(2,4),
            16
        );


    const b =
        parseInt(
            hex.substring(4,6),
            16
        );


    const luminance =
        (0.299*r +
         0.587*g +
         0.114*b);


    return luminance > 175
        ? "#514957"
        : "#ffffff";

}
