<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAS! Timetable</title>

<style>

/* =========================================================
   YAS! TIMETABLE
   OFFLINE VERSION
   ========================================================= */

:root {
    --bg: #f8f5fb;
    --card: #ffffff;
    --text: #504957;
    --muted: #8b8492;
    --border: #e7e0eb;
    --primary: #9b7eb3;
    --primary-dark: #77578f;
    --danger: #d98b8b;
    --soft: #f3edf6;
    --shadow: 0 8px 25px rgba(80,60,90,.08);
}

* {
    box-sizing: border-box;
}

html,
body,
button,
input,
select,
textarea {
    font-family:
        "Cabin",
        "Poppins",
        "Noto Sans Arabic",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
}

/* =========================================================
   HEADER
   ========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,.96);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
}

.header-inner {
    width: min(1500px,95%);
    margin: auto;
    padding: 16px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: var(--primary-dark);
}

.logo span {
    color: #c68fb0;
}

.header-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

/* =========================================================
   BUTTONS
   ========================================================= */

button {
    border: 0;
    cursor: pointer;
}

.btn {
    padding: 10px 14px;
    border-radius: 11px;
    background: var(--soft);
    color: var(--text);
    transition: .18s;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn.primary {
    background: var(--primary);
    color: white;
}

.btn.primary:hover {
    background: var(--primary-dark);
}

.btn.danger {
    background: #f6e1e1;
    color: #9b5b5b;
}

/* =========================================================
   MAIN
   ========================================================= */

.container {
    width: min(1500px,95%);
    margin: 25px auto 60px;
}

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
}

.panel-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 15px;
}

/* =========================================================
   FORMS
   ========================================================= */

.settings-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit,minmax(190px,1fr));
    gap: 14px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field label {
    color: var(--muted);
    font-size: 13px;
}

.field input,
.field select,
.field textarea {
    border: 1px solid var(--border);
    background: #fcfbfd;
    border-radius: 11px;
    padding: 10px;
    outline: none;
    color: var(--text);
}

.field textarea {
    resize: vertical;
    min-height: 80px;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
    border-color: var(--primary);
}

/* =========================================================
   SUBJECT COLORS / MANAGED SUBJECTS
   ========================================================= */

.subject-list {
    display: grid;
    grid-template-columns:
        repeat(auto-fill,minmax(220px,1fr));
    gap: 10px;
}

.subject-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 9px;
    padding: 9px 12px;
    background: #faf8fb;
    border: 1px solid var(--border);
    border-radius: 11px;
}

.subject-info {
    display: flex;
    align-items: center;
    gap: 8px;
}

.color-circle {
    width: 30px;
    height: 30px;
    border: 0;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
}

/* =========================================================
   TIMETABLE
   ========================================================= */

.table-wrapper {
    width: 100%;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 15px;
}

.timetable {
    border-collapse: collapse;
    width: 100%;
    min-width: 900px;
    table-layout: fixed;
}

.timetable th,
.timetable td {
    border: 1px solid var(--border);
}

.timetable th {
    background: #f7f2f9;
    padding: 12px 7px;
    font-size: 14px;
    text-align: center;
}

.time-cell {
    width: 95px;
    min-width: 95px;
    text-align: center;
    background: #faf8fb;
    color: var(--muted);
    font-size: 12px;
    padding: 5px;
}

.day-cell {
    height: 62px;
    padding: 4px;
    vertical-align: top;
}

.empty-cell {
    background: white;
    cursor: pointer;
}

.empty-cell:hover {
    background: #faf7fc;
}

.deleted-time {
    background:
        repeating-linear-gradient(
            45deg,
            #f6f1f8,
            #f6f1f8 8px,
            #ece5ef 8px,
            #ece5ef 16px
        );
}

/* =========================================================
   LESSON
   ========================================================= */

.lesson {
    width: 100%;
    height: 100%;
    min-height: 54px;
    border-radius: 11px;
    padding: 7px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    overflow: hidden;
    transition: .15s;
}

.lesson:hover {
    transform: scale(1.01);
    box-shadow: 0 5px 14px rgba(0,0,0,.10);
}

.lesson-name {
    font-weight: 800;
    font-size: 14px;
}

.lesson-time {
    font-size: 10px;
    margin-top: 3px;
    opacity: .75;
}

.lesson-info {
    font-size: 10px;
    margin-top: 3px;
    opacity: .78;
}

.lesson-long {
    min-height: 120px;
}

/* =========================================================
   DELETED PERIODS
   ========================================================= */

.deleted-list {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.deleted-item {
    background: #f6e3e3;
    color: #945b5b;
    padding: 7px 10px;
    border-radius: 10px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.deleted-item button {
    background: transparent;
    color: inherit;
    font-weight: bold;
    cursor: pointer;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(40,30,45,.38);
    padding: 18px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: min(650px,100%);
    max-height: 92vh;
    overflow-y: auto;
    background: white;
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.22);
}

.modal h2 {
    margin-top: 0;
}

.modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
}

.full {
    grid-column: 1 / -1;
}

.modal-actions {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;
    z-index: 1000;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #514a58;
    color: white;
    padding: 11px 17px;
    border-radius: 12px;
    opacity: 0;
    transition: .25s;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================================================
   PRINT
   ========================================================= */

@media print {
    :root, html, body, * {
        print-color-adjust: exact !important;
        -webkit-print-color-adjust: exact !important;
    }
    html, body {
        width: 100% !important; margin: 0 !important; padding: 0 !important;
        background: #fff !important; color: #000 !important;
    }
    header, .no-print, .modal-overlay, .toast, button {
        display: none !important;
    }
    .container {
        width: 100% !important; max-width: none !important;
        margin: 0 !important; padding: 0 !important;
    }
    .panel {
        width: 100% !important; margin: 0 !important; padding: 0 !important;
        border: 0 !important; border-radius: 0 !important; box-shadow: none !important;
        break-inside: avoid;
    }
    #printTitle {
        color: #000 !important; margin: 0 0 4mm !important; font-size: 18pt !important;
    }
    .table-wrapper {
        width: 100% !important; overflow: visible !important;
        border: 0 !important; border-radius: 0 !important;
    }
    .timetable {
        width: 100% !important; min-width: 0 !important;
        table-layout: fixed !important; border-collapse: collapse !important;
    }
    .lesson, .lesson-name, .lesson-time, .lesson-info,
    .timetable th, .time-cell { color: #000 !important; }
    .lesson { box-shadow: none !important; transform: none !important; }
    @page { size: A4 landscape; margin: 5mm; }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px) {
    .header-inner {
        flex-direction: column;
        align-items: stretch;
    }
    .header-actions {
        justify-content: center;
    }
    .modal-grid {
        grid-template-columns: 1fr;
    }
    .full {
        grid-column: auto;
    }
}

</style>
</head>


<body>

<!-- =======================================================
     HEADER
======================================================= -->

<header>

<div class="header-inner">

    <div class="logo">
        YAS<span>!</span>
    </div>

    <div class="header-actions">

        <button class="btn"
                onclick="openLessonModal()">
            ＋ <span data-i18n="addLesson">Ajouter</span>
        </button>

        <button class="btn"
                onclick="saveData()">
            💾 <span data-i18n="save">Sauvegarder</span>
        </button>

        <button class="btn"
                onclick="window.print()">
            🖨️ <span data-i18n="print">Imprimer</span>
        </button>

        <button class="btn"
                onclick="exportPNG()">
            🖼️ PNG
        </button>

        <button class="btn primary"
                onclick="printPDF()">
            📄 PDF
        </button>

    </div>

</div>

</header>


<main class="container">


<!-- =======================================================
     GENERAL SETTINGS
======================================================= -->

<section class="panel no-print">

<div class="panel-title"
     data-i18n="settings">
    Paramètres
</div>


<div class="settings-grid">


    <!-- LANGUAGE -->

    <div class="field">

        <label data-i18n="language">
            Langue
        </label>

        <select id="language"
                onchange="changeLanguage(this.value)">

            <option value="fr">Français</option>
            <option value="ar">العربية</option>
            <option value="darija">الدارجة</option>
            <option value="en">English</option>
            <option value="es">Español</option>

        </select>

    </div>


    <!-- TABLE TITLE -->

    <div class="field">

        <label data-i18n="tableTitle">
            Titre du tableau
        </label>

        <input id="tableTitle"
               value="Mon emploi du temps"
               oninput="updateTitle()">

    </div>


    <!-- ORIENTATION -->

    <div class="field">

        <label data-i18n="orientation">
            Orientation
        </label>

        <select id="orientation"
                onchange="renderTimetable()">

            <option value="vertical"
                    data-i18n="vertical">
                Vertical
            </option>

            <option value="horizontal"
                    data-i18n="horizontal">
                Horizontal
            </option>

        </select>

    </div>


    <!-- NUMBER OF DAYS -->

    <div class="field">

        <label data-i18n="numberDays">
            Nombre de jours
        </label>

        <select id="numberDays"
                onchange="changeNumberOfDays()">

            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>

        </select>

    </div>


    <!-- DAY START -->

    <div class="field">

        <label data-i18n="dayStart">
            Début de la journée
        </label>

        <input type="time"
               id="dayStart"
               value="08:00"
               onchange="renderTimetable()">

    </div>


    <!-- DAY END -->

    <div class="field">

        <label data-i18n="dayEnd">
            Fin de la journée
        </label>

        <input type="time"
               id="dayEnd"
               value="18:00"
               onchange="renderTimetable()">

    </div>


    <!-- FREE SLOT DURATION -->

    <div class="field">

        <label data-i18n="slotDuration">
            Durée des créneaux
        </label>

        <input type="number"
               id="slotDuration"
               min="5"
               max="240"
               step="5"
               value="60"
               onchange="renderTimetable()">

    </div>


</div>

</section>


<!-- =======================================================
     ADD & MANAGE SUBJECTS
======================================================= -->

<section class="panel no-print">

<div class="panel-title"
     data-i18n="addSubjectTitle">
    Ajouter & Gérer des Matières
</div>

<div class="settings-grid" style="margin-bottom: 15px;">

    <div class="field">
        <label data-i18n="newSubjectName">Nom de la matière</label>
        <input type="text" id="newSubjectName" placeholder="Ex: Mathématiques">
    </div>

    <div class="field">
        <label data-i18n="color">Couleur</label>
        <input type="color" id="newSubjectColor" value="#c9dcf2" style="height: 40px; width:100%; border:0; padding:0; background:none; cursor:pointer;">
    </div>

    <div class="field">
        <label>&nbsp;</label>
        <button class="btn primary" onclick="addNewSubject()">
            ＋ <span data-i18n="addSubjectBtn">Ajouter la matière</span>
        </button>
    </div>

</div>

<div style="font-size:13px;color:var(--muted);margin-bottom:8px;" data-i18n="colors">
    Couleurs des matières
</div>

<div id="subjectList" class="subject-list">
</div>

</section>


<!-- =======================================================
     DELETE TIME (ADVANCED TARGETING)
======================================================= -->

<section class="panel no-print">

<div class="panel-title"
     data-i18n="deletePeriod">
    Supprimer une période vide
</div>


<div class="settings-grid">

    <!-- TARGET DAY SELECTION -->
    <div class="field">
        <label data-i18n="targetDays">
            Jours concernés
        </label>
        <select id="deleteTargetType" onchange="toggleDeleteDaySelect()">
            <option value="all" data-i18n="allDays">Tous les jours</option>
            <option value="single" data-i18n="singleDay">Un jour précis</option>
        </select>
    </div>

    <div class="field" id="deleteSingleDayContainer" style="display: none;">
        <label data-i18n="day">Jour</label>
        <select id="deleteTargetDay"></select>
    </div>


    <div class="field">

        <label data-i18n="from">
            De
        </label>

        <input type="time"
               id="deleteStart"
               value="13:00">

    </div>


    <div class="field">

        <label data-i18n="to">
            À
        </label>

        <input type="time"
               id="deleteEnd"
               value="14:00">

    </div>


    <div class="field">

        <label>&nbsp;</label>

        <button class="btn danger"
                onclick="deleteTimePeriod()">

            🗑️
            <span data-i18n="delete">
                Supprimer
            </span>

        </button>

    </div>

</div>


<div style="margin-top:15px">

<div style="font-size:13px;color:var(--muted)"
     data-i18n="deletedPeriods">

    Périodes supprimées

</div>

<div id="deletedList"
     class="deleted-list"
     style="margin-top:8px">
</div>

</div>

</section>


<!-- =======================================================
     TIMETABLE
======================================================= -->

<section class="panel">

<h1 id="printTitle"
    style="
        text-align:center;
        font-size:25px;
        margin:5px 0 20px;
    ">
    Mon emploi du temps
</h1>


<div class="table-wrapper">

<table id="timetable"
       class="timetable">

</table>

</div>

</section>

</main>


<!-- =======================================================
     LESSON MODAL
======================================================= -->

<div id="lessonModal"
     class="modal-overlay">

<div class="modal">

<h2 id="modalTitle">
    Ajouter une séance
</h2>


<div class="modal-grid">


    <!-- DAY -->

    <div class="field">

        <label data-i18n="day">
            Jour
        </label>

        <select id="lessonDay"></select>

    </div>


    <!-- SUBJECT -->

    <div class="field">

        <label data-i18n="subject">
            Matière
        </label>

        <input id="lessonSubject"
               list="subjectOptions"
               placeholder="Math"
               oninput="onSubjectInputChange(this.value)">

        <datalist id="subjectOptions"></datalist>

    </div>


    <!-- START -->

    <div class="field">

        <label data-i18n="start">
            Début
        </label>

        <input type="time"
               id="lessonStart"
               value="08:00">

    </div>


    <!-- END -->

    <div class="field">

        <label data-i18n="end">
            Fin
        </label>

        <input type="time"
               id="lessonEnd"
               value="09:00">

    </div>


    <!-- TEACHER -->

    <div class="field">

        <label data-i18n="teacher">
            Professeur
        </label>

        <input id="lessonTeacher"
               placeholder="...">

    </div>


    <!-- LOCATION -->

    <div class="field">

        <label data-i18n="location">
            Salle / Lieu
        </label>

        <input id="lessonLocation"
               placeholder="Salle 12">

    </div>


    <!-- COLOR -->

    <div class="field full">

        <label data-i18n="color">
            Couleur
        </label>

        <div style="
            display:flex;
            align-items:center;
            gap:12px;
        ">

            <input type="color"
                   id="lessonColor"
                   value="#d9c5e8"
                   style="
                       width:55px;
                       height:40px;
                       border:0;
                       background:none;
                       padding:0;
                   ">

            <span id="colorHex">
                #d9c5e8
            </span>

        </div>

    </div>


</div>


<div class="modal-actions">


    <button class="btn danger"
            id="deleteLessonBtn"
            onclick="deleteCurrentLesson()"
            style="display:none">

        🗑️
        <span data-i18n="delete">
            Supprimer
        </span>

    </button>


    <button class="btn"
            onclick="closeLessonModal()">

        <span data-i18n="cancel">
            Annuler
        </span>

    </button>


    <button class="btn primary"
            onclick="saveLesson()">

        ✓
        <span data-i18n="confirm">
            Enregistrer
        </span>

    </button>


</div>

</div>

</div>


<div id="toast"
     class="toast">
</div>

    const isArabic =
        lang === "ar" ||
        lang === "darija";


    document.documentElement.lang =
        isArabic ? "ar" : lang;


    document.documentElement.dir =
        isArabic ? "rtl" : "ltr";


    document.body.style.direction =

    document.querySelectorAll(
        "[data-i18n]"
    ).forEach(el=>{

    document.querySelectorAll(
        "#orientation option, #deleteTargetType option"
    ).forEach(option=>{

/* =========================================================
   TIME HELPERS
========================================================= */

function timeToMinutes(time){

    const [h,m] =
        time.split(":").map(Number);

    return h*60+m;

}


function minutesToTime(minutes){

    const h =
        Math.floor(minutes/60)
        .toString()
        .padStart(2,"0");

    const m =
        (minutes%60)
        .toString()
        .padStart(2,"0");

    return `${h}:${m}`;

}


/* =========================================================
   TIME SLOTS
========================================================= */

function getTimeSlots(){

    const start =
        timeToMinutes(
            document.getElementById("dayStart").value
        );

    const end =
        timeToMinutes(
            document.getElementById("dayEnd").value
        );

    const duration =
        Number(
            document.getElementById("slotDuration").value
        );

    const slots = [];

    if(
        duration <= 0 ||
        end <= start
    ){

        return slots;

    }


    for(
        let t=start;
        t<end;
        t+=duration
    ){

        const e =
            Math.min(
                t+duration,
                end
            );

        slots.push({

            start:minutesToTime(t),

            end:minutesToTime(e)

        });

    }

    return slots;

}


/* =========================================================
   DELETE PERIOD (WITH DAY TARGETING)
========================================================= */

function toggleDeleteDaySelect(){
    const targetType = document.getElementById("deleteTargetType").value;
    const container = document.getElementById("deleteSingleDayContainer");
    container.style.display = targetType === "single" ? "flex" : "none";
}

function populateDeleteDaySelect(){
    const select = document.getElementById("deleteTargetDay");
    if(!select) return;
    select.innerHTML = "";
    state.days.forEach(day => {
        const opt = document.createElement("option");
        opt.value = day;
        opt.textContent = day;
        select.appendChild(opt);
    });
}

function deleteTimePeriod(){

    const start = document.getElementById("deleteStart").value;
    const end = document.getElementById("deleteEnd").value;
    const targetType = document.getElementById("deleteTargetType").value;
    const targetDay = targetType === "single" ? document.getElementById("deleteTargetDay").value : "ALL";


    if(
        !start ||
        !end ||
        timeToMinutes(start) >= timeToMinutes(end)
    ){
        showToast(T[state.language].invalidPeriod || "Invalid time period.");
        return;
    }


    /*
       Check conflicts with lessons on target day(s)
    */
    const conflict = state.lessons.some(lesson => {
        const isDayMatch = targetDay === "ALL" || lesson.day === targetDay;
        if (!isDayMatch) return false;

        return (
            timeToMinutes(lesson.start) < timeToMinutes(end) &&
            timeToMinutes(lesson.end) > timeToMinutes(start)
        );
    });


    if(conflict){
        showToast(T[state.language].lessonConflict || "Une séance existe dans cette période.");
        return;
    }


    state.deletedPeriods.push({
        start,
        end,
        day: targetDay
    });


    renderTimetable();

    updateDeletedList();

    saveData(false);

    showToast(T[state.language].periodDeleted || "Période supprimée ✓");

}


function isDeleted(start, end, dayName){

    const s = timeToMinutes(start);
    const e = timeToMinutes(end);

    return state.deletedPeriods.some(period => {
        const matchesDay = period.day === "ALL" || period.day === dayName;
        return matchesDay && (s >= timeToMinutes(period.start) && e <= timeToMinutes(period.end));
    });

}


function restorePeriod(index){

    state.deletedPeriods.splice(
        index,
        1
    );

    renderTimetable();

    updateDeletedList();

    saveData(false);

}


function updateDeletedList(){

    const container = document.getElementById("deletedList");
    container.innerHTML = "";

    const allDaysLabel = T[state.language].allDays || "Tous les jours";

    state.deletedPeriods.forEach((period, index) => {

        const div = document.createElement("div");
        div.className = "deleted-item";

        const dayTag = period.day === "ALL" ? `[${allDaysLabel}]` : `[${period.day}]`;

        div.innerHTML = `
            <span>${dayTag} ${period.start} → ${period.end}</span>
            <button onclick="restorePeriod(${index})">×</button>
        `;

        container.appendChild(div);

    });

}

/* =========================================================
   RENDER TIMETABLE
========================================================= */

function renderTimetable(){

    state.dayStart =
        document.getElementById("dayStart").value;

    state.dayEnd =
        document.getElementById("dayEnd").value;

    state.slotDuration =
        Number(document.getElementById("slotDuration").value);

    state.orientation =
        document.getElementById("orientation").value;


    document.getElementById("printTitle").textContent =
        state.title || " ";


    if(state.orientation === "horizontal"){
        renderHorizontal();
    }else{
        renderVertical();
    }

}


/* =========================================================
   VERTICAL TABLE
========================================================= */

function renderVertical(){

    const table = document.getElementById("timetable");
    table.innerHTML = "";

    const slots = getTimeSlots();

    const thead = document.createElement("thead");
    const header = document.createElement("tr");

    const timeHead = document.createElement("th");
    timeHead.textContent = "⏰";
    header.appendChild(timeHead);

    state.days.forEach(day=>{
        const th = document.createElement("th");
        th.textContent = day;
        header.appendChild(th);
    });

    thead.appendChild(header);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    const skip = {};

    slots.forEach((slot,index)=>{

        const row = document.createElement("tr");

        const time = document.createElement("td");
        time.className = "time-cell";
        time.innerHTML =
            `<strong>${slot.start}</strong><br>↓<br>${slot.end}`;

        row.appendChild(time);

        state.days.forEach((day,dayIndex)=>{

            if(skip[dayIndex]){
                skip[dayIndex]--;
                return;
            }

            const cell = document.createElement("td");
            cell.className = "day-cell";

            const lesson = state.lessons.find(
                l => l.day === day && l.start === slot.start
            );

            if(lesson){

                const duration =
                    timeToMinutes(lesson.end) - timeToMinutes(lesson.start);

                const slotMinutes = Number(state.slotDuration);
                let rows = Math.ceil(duration / slotMinutes);

                let possibleRows = 0;

                for(let i=index; i<slots.length; i++){

                    if(isDeleted(slots[i].start, slots[i].end, day)){
                        break;
                    }

                    if(timeToMinutes(slots[i].start) >= timeToMinutes(lesson.end)){
                        break;
                    }

                    possibleRows++;
                }

                rows = Math.min(rows, possibleRows);
                rows = Math.max(1, rows);

                cell.rowSpan = rows;
                skip[dayIndex] = rows-1;

                cell.appendChild(createLesson(lesson));

            }else{

                if(isDeleted(slot.start, slot.end, day)){
                    cell.classList.add("deleted-time");
                }else{
                    cell.classList.add("empty-cell");
                    cell.ondblclick = ()=>{
                        openLessonModal({
                            day,
                            start:slot.start,
                            end:slot.end
                        });
                    };
                }

            }

            row.appendChild(cell);

        });

        tbody.appendChild(row);

    });

    table.appendChild(tbody);

}


/* =========================================================
   HORIZONTAL TABLE
========================================================= */

function renderHorizontal(){

    const table = document.getElementById("timetable");
    table.innerHTML = "";

    const slots = getTimeSlots();

    const thead = document.createElement("thead");
    const header = document.createElement("tr");

    const dayHead = document.createElement("th");
    dayHead.textContent = "📅";
    header.appendChild(dayHead);

    slots.forEach(slot=>{
        const th = document.createElement("th");
        th.innerHTML = `${slot.start}<br>↓<br>${slot.end}`;
        header.appendChild(th);
    });

    thead.appendChild(header);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    state.days.forEach(day=>{

        const row = document.createElement("tr");

        const dayCell = document.createElement("td");
        dayCell.className = "time-cell";
        dayCell.innerHTML = `<strong>${day}</strong>`;

        row.appendChild(dayCell);

        let skip = 0;

        slots.forEach((slot,index)=>{

            if(skip > 0){
                skip--;
                return;
            }

            const cell = document.createElement("td");
            cell.className = "day-cell";

            const lesson = state.lessons.find(
                l => l.day === day && l.start === slot.start
            );

            if(lesson){

                const duration = timeToMinutes(lesson.end) - timeToMinutes(lesson.start);
                const slotMinutes = Number(state.slotDuration);
                let columns = Math.ceil(duration / slotMinutes);

                let possible = 0;

                for(let i=index; i<slots.length; i++){

                    if(isDeleted(slots[i].start, slots[i].end, day)){
                        break;
                    }

                    if(timeToMinutes(slots[i].start) >= timeToMinutes(lesson.end)){
                        break;
                    }

                    possible++;
                }

                columns = Math.min(columns, possible);
                columns = Math.max(1, columns);

                cell.colSpan = columns;
                skip = columns-1;

                cell.appendChild(createLesson(lesson));

            }else{

                if(isDeleted(slot.start, slot.end, day)){
                    cell.classList.add("deleted-time");
                }else{
                    cell.classList.add("empty-cell");
                    cell.ondblclick = ()=>{
                        openLessonModal({
                            day,
                            start:slot.start,
                            end:slot.end
                        });
                    };
                }

            }

            row.appendChild(cell);

        });

        tbody.appendChild(row);

    });

    table.appendChild(tbody);

}


/* =========================================================
   LESSON CARD
========================================================= */

function createLesson(lesson){

    const div = document.createElement("div");
    div.className = "lesson";

    const duration = timeToMinutes(lesson.end) - timeToMinutes(lesson.start);

    if(duration >= 120){
        div.classList.add("lesson-long");
    }

    const color = lesson.color || getSubjectColor(lesson.subject);

    div.style.background = color;
    div.style.color = "#000000";

    let info = "";

    if(lesson.teacher){
        info += escapeHTML(lesson.teacher);
    }

    if(lesson.location){
        if(info) info += " • ";
        info += escapeHTML(lesson.location);
    }

    div.innerHTML = `
        <div class="lesson-name">${escapeHTML(lesson.subject)}</div>
        <div class="lesson-time">${lesson.start} – ${lesson.end}</div>
        ${info ? `<div class="lesson-info">${info}</div>` : ""}
    `;

    div.onclick = ()=>openLessonModal(lesson);

    return div;

}


/* =========================================================
   MODAL
========================================================= */

function openLessonModal(preset=null){

    editingLessonId = preset && preset.id ? preset.id : null;

    document.getElementById("lessonModal").classList.add("show");

    const daySelect = document.getElementById("lessonDay");
    daySelect.innerHTML = "";

    state.days.forEach(day=>{
        const option = document.createElement("option");
        option.value = day;
        option.textContent = day;
        daySelect.appendChild(option);
    });

    document.getElementById("deleteLessonBtn").style.display =
        editingLessonId ? "inline-block" : "none";

    if(editingLessonId){
        const lesson = state.lessons.find(l => l.id === editingLessonId);
        fillModal(lesson);
    }else{
        document.getElementById("modalTitle").textContent =
            T[state.language].addLesson || "Ajouter une séance";

        document.getElementById("lessonDay").value =
            preset?.day || state.days[0];

        document.getElementById("lessonSubject").value = "";

        document.getElementById("lessonStart").value =
            preset?.start || state.dayStart;

        document.getElementById("lessonEnd").value =
            preset?.end ||
            minutesToTime(timeToMinutes(preset?.start || state.dayStart) + Number(state.slotDuration));

        document.getElementById("lessonTeacher").value = "";
        document.getElementById("lessonLocation").value = "";
        document.getElementById("lessonColor").value = "#d9c5e8";
    }

    updateColorText();

}


function fillModal(lesson){

    document.getElementById("modalTitle").textContent =
        "Modifier la séance";

    document.getElementById("lessonDay").value = lesson.day;
    document.getElementById("lessonSubject").value = lesson.subject;
    document.getElementById("lessonStart").value = lesson.start;
    document.getElementById("lessonEnd").value = lesson.end;
    document.getElementById("lessonTeacher").value = lesson.teacher || "";
    document.getElementById("lessonLocation").value = lesson.location || "";
    document.getElementById("lessonColor").value =
        lesson.color || getSubjectColor(lesson.subject);

}


function closeLessonModal(){
    document.getElementById("lessonModal").classList.remove("show");
    editingLessonId = null;
}


document.getElementById("lessonColor").addEventListener("input", updateColorText);

function updateColorText(){
    document.getElementById("colorHex").textContent =
        document.getElementById("lessonColor").value;
}


/* =========================================================
   SAVE LESSON
========================================================= */

function saveLesson(){

    const day = document.getElementById("lessonDay").value;
    const subject = document.getElementById("lessonSubject").value.trim();
    const start = document.getElementById("lessonStart").value;
    const end = document.getElementById("lessonEnd").value;
    const teacher = document.getElementById("lessonTeacher").value.trim();
    const location = document.getElementById("lessonLocation").value.trim();
    const color = document.getElementById("lessonColor").value;


    if(!subject){
        showToast("Veuillez entrer une matière.");
        return;
    }


    if(!start || !end || timeToMinutes(start) >= timeToMinutes(end)){
        showToast("Vérifiez les horaires.");
        return;
    }


    /*
       Check deleted periods for specific day
    */
    const deletedConflict = state.deletedPeriods.some(period => {
        const matchesDay = period.day === "ALL" || period.day === day;
        return matchesDay && (
            timeToMinutes(start) < timeToMinutes(period.end) &&
            timeToMinutes(end) > timeToMinutes(period.start)
        );
    });


    if(deletedConflict){
        showToast("Cette séance traverse une période supprimée.");
        return;
    }


    /*
       Check overlap
    */
    const overlap = state.lessons.some(existing => {
        if(editingLessonId && existing.id === editingLessonId) return false;
        if(existing.day !== day) return false;

        return (
            timeToMinutes(start) < timeToMinutes(existing.end) &&
            timeToMinutes(end) > timeToMinutes(existing.start)
        );
    });


    if(overlap){
        showToast("Cette séance chevauche une autre séance.");
        return;
    }


    if(editingLessonId){
        const lesson = state.lessons.find(l => l.id === editingLessonId);
        if(lesson){
            lesson.day = day;
            lesson.subject = subject;
            lesson.start = start;
            lesson.end = end;
            lesson.teacher = teacher;
            lesson.location = location;
            lesson.color = color;
        }
    }else{
        state.lessons.push({
            id: Date.now().toString(),
            day,
            subject,
            start,
            end,
            teacher,
            location,
            color
        });
    }


    /*
       Always save / remember subject color
    */
    state.colors[subject] = color;


    renderSubjectColors();
    updateSubjectOptions();
    renderTimetable();
    saveData(false);
    closeLessonModal();

    showToast("Séance enregistrée ✓");

}


/* =========================================================
   DELETE LESSON
========================================================= */

function deleteCurrentLesson(){

    if(!editingLessonId) return;

    state.lessons = state.lessons.filter(l => l.id !== editingLessonId);

    renderTimetable();
    renderSubjectColors();
    saveData(false);
    closeLessonModal();

    showToast("Séance supprimée.");

}


/* =========================================================
   NUMBER OF DAYS
========================================================= */

function changeNumberOfDays(){

    const number = Number(document.getElementById("numberDays").value);

    state.numberDays = number;

    state.lessons = state.lessons.filter(
        lesson => DAYS[state.language].slice(0,number).includes(lesson.day)
    );

    state.days = DAYS[state.language].slice(0,number);

    populateDeleteDaySelect();
    renderTimetable();
    renderSubjectColors();
    saveData(false);

}


/* =========================================================
   SUBJECT COLORS
========================================================= */

function getSubjectColor(subject){

    if(!state.colors[subject]){
        state.colors[subject] = randomPastel();
    }

    return state.colors[subject];

}


function randomPastel(){

    const colors = [
        "#c9dcf2", "#f3c7d9", "#d9c8ee", "#e9b6b6",
        "#f4df9e", "#d9c5b2", "#a8c7b0", "#b4c9e8",
        "#c8dfc5", "#e7c9e5", "#c8e2df"
    ];

    return colors[Math.floor(Math.random()*colors.length)];

}


function renderSubjectColors(){

    const container = document.getElementById("subjectList");
    container.innerHTML = "";

    const subjects = Object.keys(state.colors);

    subjects.forEach(subject => {

        const item = document.createElement("div");
        item.className = "subject-item";

        const info = document.createElement("div");
        info.className = "subject-info";

        const color = document.createElement("input");
        color.type = "color";
        color.className = "color-circle";
        color.value = getSubjectColor(subject);

        color.oninput = ()=>{
            state.colors[subject] = color.value;

            state.lessons.forEach(lesson => {
                if(lesson.subject === subject){
                    lesson.color = color.value;
                }
            });

            renderTimetable();
            saveData(false);
        };

        const name = document.createElement("span");
        name.textContent = subject;

        info.appendChild(color);
        info.appendChild(name);

        const delBtn = document.createElement("button");
        delBtn.innerHTML = "×";
        delBtn.style.background = "none";
        delBtn.style.color = "var(--danger)";
        delBtn.style.fontSize = "16px";
        delBtn.style.fontWeight = "bold";
        delBtn.onclick = () => deleteSubject(subject);

        item.appendChild(info);
        item.appendChild(delBtn);

        container.appendChild(item);

    });

    updateSubjectOptions();

}


/* =========================================================
   SUBJECT AUTOCOMPLETE
========================================================= */

function updateSubjectOptions(){

    const list = document.getElementById("subjectOptions");
    if(!list) return;

    list.innerHTML = "";

    Object.keys(state.colors).forEach(subject => {
        const option = document.createElement("option");
        option.value = subject;
        list.appendChild(option);
    });

}


/* =========================================================
   SAVE / LOAD
========================================================= */

function saveData(show=true){

    state.title = document.getElementById("tableTitle").value;
    state.orientation = document.getElementById("orientation").value;
    state.dayStart = document.getElementById("dayStart").value;
    state.dayEnd = document.getElementById("dayEnd").value;
    state.slotDuration = Number(document.getElementById("slotDuration").value);

    localStorage.setItem("YAS_TIMETABLE_DATA", JSON.stringify(state));

    if(show){
        showToast("Tableau sauvegardé ✓");
    }

}


function loadData(){

    const saved = localStorage.getItem("YAS_TIMETABLE_DATA");

    if(!saved){
        createDays();
        return;
    }

    try{
        const data = JSON.parse(saved);
        state = Object.assign(state, data);
    }catch(error){
        console.error(error);
        createDays();
    }

}


/* =========================================================
   EXPORT PNG
========================================================= */

async function exportPNG(){
    const table = document.getElementById("timetable");
    if(!table || !table.rows.length){
        showToast("Le tableau est vide.");
        return;
    }

    try {
        const tableRect = table.getBoundingClientRect();
        const width = Math.ceil(Math.max(table.scrollWidth, tableRect.width));
        const height = Math.ceil(Math.max(table.scrollHeight, tableRect.height));
        const scale = 2;
        const titleHeight = 58;

        const canvas = document.createElement("canvas");
        canvas.width = width * scale;
        canvas.height = (height + titleHeight) * scale;
        const ctx = canvas.getContext("2d");
        if(!ctx) throw new Error("Canvas indisponible");

        ctx.scale(scale, scale);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height + titleHeight);

        ctx.fillStyle = "#000000";
        ctx.font = "bold 26px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(state.title || "YAS! Timetable", width / 2, 28);

        function box(el){
            const r = el.getBoundingClientRect();
            return {x:r.left-tableRect.left, y:r.top-tableRect.top+titleHeight, w:r.width, h:r.height};
        }

        function wrapped(text, x, y, maxW, lineH, maxLines=3){
            const words = String(text || "").split(/\s+/).filter(Boolean);
            const lines = [];
            let line = "";
            for(const word of words){
                const next = line ? line + " " + word : word;
                if(ctx.measureText(next).width > maxW && line){
                    lines.push(line); line = word;
                } else line = next;
            }
            if(line) lines.push(line);
            const visible = lines.slice(0, maxLines);
            const top = y - (visible.length - 1) * lineH / 2;
            visible.forEach((t,i)=>ctx.fillText(t, x, top + i*lineH));
        }

        table.querySelectorAll("th, td").forEach(cell=>{
            const r = box(cell);
            const cs = getComputedStyle(cell);
            ctx.fillStyle = cs.backgroundColor && cs.backgroundColor !== "rgba(0, 0, 0, 0)"
                ? cs.backgroundColor : "#ffffff";
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = "#d9d2df";
            ctx.lineWidth = 1;
            ctx.strokeRect(r.x, r.y, r.w, r.h);

            const lesson = cell.querySelector(":scope > .lesson");
            if(lesson){
                const q = box(lesson);
                const ls = getComputedStyle(lesson);
                ctx.fillStyle = ls.backgroundColor || "#ffffff";
                ctx.fillRect(q.x+2, q.y+2, Math.max(0,q.w-4), Math.max(0,q.h-4));

                const name = lesson.querySelector(".lesson-name")?.innerText.trim() || "";
                const time = lesson.querySelector(".lesson-time")?.innerText.trim() || "";
                const info = lesson.querySelector(".lesson-info")?.innerText.trim() || "";
                const lines = [name,time,info].filter(Boolean);
                const fs = Math.max(9, Math.min(15, q.w/9));
                const lh = Math.max(12, Math.min(18, q.h/(lines.length+1)));
                ctx.save();
                ctx.beginPath(); ctx.rect(q.x+4,q.y+3,Math.max(0,q.w-8),Math.max(0,q.h-6)); ctx.clip();
                ctx.fillStyle = "#000000"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                lines.forEach((t,i)=>{
                    ctx.font = i===0 ? `bold ${fs}px Arial, sans-serif` : `${Math.max(9,fs-3)}px Arial, sans-serif`;
                    wrapped(t,q.x+q.w/2,q.y+q.h/2+(i-(lines.length-1)/2)*lh,q.w-12,lh,2);
                });
                ctx.restore();
                return;
            }

            const text = (cell.innerText || "").trim();
            const lines = text.split(/\n/).map(x=>x.trim()).filter(Boolean);
            ctx.fillStyle = "#000000";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.font = cell.tagName === "TH" ? "bold 12px Arial, sans-serif" : "11px Arial, sans-serif";
            const shown = lines.slice(0, Math.max(1,Math.floor((r.h-4)/14)));
            shown.forEach((t,i)=>wrapped(t,r.x+r.w/2,r.y+r.h/2+(i-(shown.length-1)/2)*14,r.w-8,14,2));
        });

        canvas.toBlob(blob=>{
            if(!blob){ showToast("Impossible de créer l’image."); return; }
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.download = "YAS-Timetable.png";
            link.href = url;
            link.click();
            setTimeout(()=>URL.revokeObjectURL(url),1000);
            showToast("PNG exporté ✓");
        },"image/png");
    } catch(error){
        console.error(error);
        showToast("Erreur pendant l’export PNG.");
    }
}


function printPDF(){
    window.print();
}


function escapeHTML(text){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'",&#039;);
}


function showToast(message){
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(()=>{ toast.classList.remove("show"); }, 2300);
}


document.getElementById("lessonModal").addEventListener("click", function(event){
    if(event.target === this){
        closeLessonModal();
    }
});


document.addEventListener("keydown", event=>{
    if(event.key === "Escape"){
        closeLessonModal();
    }
});
